<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Training">
<meta name="theme-color" content="#0F1A19">
<meta name="format-detection" content="telephone=no">
<title>Trainingsplan</title>
<style>
:root{
  --bg:#0F1A19; --panel:#162523; --panel2:#1D302D; --line:#2A413D; --line2:#3A5551;
  --ink:#E8EFED; --ink2:#9FB3AF; --ink3:#6D8480;
  --teal:#3FBFA8; --oxide:#E0664F; --amber:#D9A227; --moss:#7BB661;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
  --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{margin:0;background:var(--bg);color:var(--ink);overscroll-behavior:none;
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.app{max-width:560px;margin:0 auto}
header{position:sticky;top:0;z-index:20;background:rgba(15,26,25,.94);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);padding:calc(var(--top) + 12px) 16px 11px;display:flex;align-items:center;gap:10px}
header h1{font-family:var(--mono);font-size:15px;font-weight:600;margin:0;flex:1;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .sub{font-family:var(--mono);font-size:10px;color:var(--ink3);letter-spacing:.12em;text-transform:uppercase}
.back{background:none;border:0;color:var(--teal);font-family:var(--mono);font-size:20px;padding:8px 6px;
  margin:-8px -6px;cursor:pointer;min-width:44px;min-height:44px}
main{padding:16px 16px calc(112px + var(--bot))}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);margin:0 0 10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.day{display:flex;align-items:center;gap:14px;padding:15px;width:100%;background:none;border:0;color:inherit;
  font:inherit;text-align:left;min-height:60px;cursor:pointer}
.day:active{background:var(--panel2)}
.badge{font-family:var(--mono);font-size:17px;font-weight:600;width:44px;height:44px;flex:0 0 auto;border-radius:11px;
  display:flex;align-items:center;justify-content:center;background:var(--panel2);border:1px solid var(--line2);color:var(--teal)}
.badge.done{background:var(--teal);color:#0F1A19;border-color:var(--teal)}
.day .t{flex:1;min-width:0}
.day .t b{display:block;font-size:15.5px;font-weight:600;margin-bottom:2px}
.day .t span{font-family:var(--mono);font-size:11.5px;color:var(--ink3);line-height:1.45}
.chev{color:var(--ink3);font-family:var(--mono);font-size:16px}
details{border-top:1px solid var(--line)}
summary{padding:12px 16px;font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink3);list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:44px;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--teal);font-size:16px}
details[open] summary::after{content:"–"}
.wu{padding:0 16px 14px;margin:0 0 0 18px;font-size:14.5px;color:var(--ink2)}
.wu li{margin-bottom:6px}
.whytext{padding:0 16px 14px;font-size:13.5px;color:var(--ink3);line-height:1.55;margin:0}
.grp{border-bottom:1px solid var(--line)}
.grp:last-child{border-bottom:0}
.gh{display:flex;align-items:center;gap:8px;padding:12px 16px 2px;font-family:var(--mono);font-size:10px;
  letter-spacing:.13em;text-transform:uppercase;color:var(--amber)}
.gh i{display:block;width:14px;height:1px;background:var(--amber);flex:0 0 auto}
.gh.opt{color:var(--ink3)}
.gh.opt i{background:var(--ink3)}
.pics{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--line)}
.pics:empty{display:none}
.pics figure{margin:0;position:relative;background:#000}
.pics img{display:block;width:100%;height:132px;object-fit:cover}
.pics figcaption{position:absolute;left:6px;bottom:6px;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;color:#fff;background:rgba(0,0,0,.62);padding:2px 6px;border-radius:4px}
.head{padding:13px 16px 0}
.head .n{display:flex;align-items:baseline;gap:10px;margin-bottom:5px}
.head .n b{font-size:16px;font-weight:600;line-height:1.25;flex:1}
.tgt{font-family:var(--mono);font-size:13px;color:var(--teal);white-space:nowrap}
.rir{font-family:var(--mono);font-size:10.5px;color:var(--ink3);margin-bottom:7px}
.best{font-family:var(--mono);font-size:11px;color:var(--ink2);margin-bottom:7px}
.best b{color:var(--ink);font-weight:600}
.sug{display:block;font-family:var(--mono);font-size:11.5px;line-height:1.45;border-radius:8px;
  padding:7px 9px;margin-bottom:9px;border:1px solid var(--line2);background:var(--panel2);color:var(--ink2)}
.sug b{font-size:13px;font-weight:600;color:var(--ink)}
.sug.up{border-color:var(--moss)} .sug.up b{color:var(--moss)}
.sug.down{border-color:var(--amber)} .sug.down b{color:var(--amber)}
.sug.warn{border-color:var(--oxide)} .sug.warn b{color:var(--oxide)}
.cue{display:grid;grid-template-columns:62px 1fr;gap:9px;margin-bottom:6px;font-size:13.5px;line-height:1.45}
.cue dt{font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink3);padding-top:3px}
.cue dd{margin:0;color:var(--ink2)}
.cue.warn dd{color:var(--amber)}
.hold{width:100%;margin:9px 0 2px;height:44px;border-radius:10px;border:1px solid var(--teal);background:none;
  color:var(--teal);font-family:var(--mono);font-size:13px;cursor:pointer}
.hold:active{background:var(--panel2)}
.sets{padding:10px 16px 15px}
.hdr,.set{display:grid;grid-template-columns:20px 74px 1fr 1fr;gap:7px;align-items:center}
.hdr{margin-bottom:6px;font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3)}
.hdr span:nth-child(3),.hdr span:nth-child(4){text-align:center}
.set{margin-bottom:3px}
.set label{font-family:var(--mono);font-size:12px;color:var(--ink3)}
.set .prev{font-family:var(--mono);font-size:11px;color:var(--ink3);white-space:nowrap;overflow:hidden}
.set input{width:100%;height:48px;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;
  color:var(--ink);font-family:var(--mono);font-size:17px;text-align:center;padding:0 2px;-webkit-appearance:none}
.set input:focus{outline:2px solid var(--teal);outline-offset:-1px;border-color:var(--teal)}
.set .kgw{display:flex;gap:4px;align-items:center}
.set .kgw input{flex:1;min-width:0}
.pm{flex:0 0 auto;width:34px;height:48px;border-radius:10px;border:1px solid var(--line2);
  background:var(--panel2);color:var(--teal);font-family:var(--mono);font-size:16px;cursor:pointer;padding:0}
.pm:active{background:var(--line)}
.set input::placeholder{color:#4E6360}
.set input.pre{color:var(--ink3);font-style:italic}
.set input::-webkit-outer-spin-button,.set input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.set.filled input{border-color:var(--line);opacity:.72}
.rr{display:none;grid-template-columns:20px 1fr;gap:7px;align-items:center;margin:0 0 7px}
.rr.on{display:grid}
.rr .lb{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.rr .ch{display:flex;gap:5px;flex-wrap:wrap}
.rr button{flex:1 1 auto;min-width:38px;height:34px;border-radius:8px;border:1px solid var(--line2);
  background:none;color:var(--ink3);font-family:var(--mono);font-size:11.5px;cursor:pointer;padding:0 4px}
.rr button.sel{background:var(--teal);border-color:var(--teal);color:#0F1A19;font-weight:600}
.tbar{position:fixed;left:0;right:0;bottom:calc(74px + var(--bot));z-index:26;padding:0 16px;
  transform:translateY(140%);transition:transform .28s cubic-bezier(.3,1.2,.5,1);pointer-events:none}
.tbar.on{transform:translateY(0)}
.tbar .in{max-width:560px;margin:0 auto;background:var(--panel2);border:1px solid var(--line2);border-radius:12px;
  padding:11px 14px;display:flex;align-items:center;gap:12px;pointer-events:auto}
.tbar.sw .in{border-color:var(--amber)}
.tbar.hold .in{border-color:var(--teal)}
.tbar .num{font-family:var(--mono);font-size:26px;font-weight:600;color:var(--teal);min-width:52px;
  font-variant-numeric:tabular-nums}
.tbar.sw .num{color:var(--amber)}
.tbar .lbl{flex:1;min-width:0;font-size:13px;line-height:1.35;color:var(--ink2)}
.tbar .lbl b{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink3);font-weight:400;margin-bottom:1px}
.tbar button{background:none;border:1px solid var(--line2);border-radius:9px;color:var(--ink3);height:38px;
  padding:0 13px;font-family:var(--mono);font-size:12px;cursor:pointer;flex:0 0 auto}
.tbar.hold button{border-color:var(--teal);color:var(--teal)}
.bar{position:fixed;bottom:0;left:0;right:0;background:rgba(15,26,25,.96);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);padding:11px 16px calc(11px + var(--bot));z-index:25}
.bar .in{max-width:560px;margin:0 auto;display:flex;gap:9px}
.in2{display:flex;gap:9px}
.in2 .btn{height:44px;font-size:13px;padding:0 12px}
.btn{flex:1;height:52px;border-radius:12px;border:1px solid var(--teal);background:var(--teal);color:#0F1A19;
  font-family:var(--mono);font-size:14px;font-weight:600;cursor:pointer}
.btn:active{opacity:.85}
.btn.ghost{background:none;color:var(--ink2);border-color:var(--line2);flex:0 0 auto;padding:0 20px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + var(--bot));background:var(--moss);
  color:#0F1A19;font-family:var(--mono);font-size:13px;padding:11px 18px;border-radius:10px;z-index:40;
  opacity:0;pointer-events:none;transition:opacity .25s;max-width:88%;text-align:center}
.toast.on{opacity:1}
.hist{padding:13px 16px;font-family:var(--mono);font-size:12.5px;color:var(--ink2)}
.hist .r{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);align-items:center}
.hist .r:last-child{border-bottom:0}
.hist .r span:first-child{color:var(--ink3);flex:0 0 auto}
.hist .r .v{text-align:right;flex:1;line-height:1.4}
.hist .del{background:none;border:0;color:var(--ink3);font-size:15px;padding:4px 2px 4px 8px;cursor:pointer;flex:0 0 auto}
.wkbar{display:flex;gap:6px;margin:0 0 12px}
.wkbar .c{flex:1;text-align:center;padding:8px 2px;border-radius:9px;border:1px solid var(--line);
  background:var(--panel);font-family:var(--mono);font-size:11px;color:var(--ink3)}
.wkbar .c.done{border-color:var(--teal);color:var(--teal)}
.wkbar .c b{display:block;font-size:14px;font-weight:600;margin-bottom:1px;color:inherit}
.note{border-radius:12px;padding:11px 13px;margin:0 0 12px;font-size:13.5px;line-height:1.5;
  border:1px solid var(--amber);background:rgba(217,162,39,.09);color:var(--ink2)}
.note b{color:var(--amber);font-family:var(--mono);font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;display:block;margin-bottom:3px}
.foot{font-size:13px;color:var(--ink3);margin:16px 2px 0;line-height:1.6}
.spark{display:block;width:100%;height:44px;margin-top:9px}
.empty{color:var(--ink3);font-size:14px;padding:26px 16px;text-align:center;font-family:var(--mono)}
#impbox{display:none;width:100%;min-height:120px;margin:8px 0 0;padding:10px;box-sizing:border-box;
  font-family:var(--mono);font-size:11px;line-height:1.5;color:var(--ink2);background:var(--bg2);
  border:1px solid var(--line2);border-radius:10px;resize:vertical;-webkit-appearance:none}
#impbox:focus{outline:none;border-color:var(--teal)}
.mode{background:none;border:1px solid var(--line2);color:var(--ink3);font-family:var(--mono);font-size:9.5px;
  letter-spacing:.1em;text-transform:uppercase;border-radius:8px;padding:6px 9px;cursor:pointer;flex:0 0 auto;min-height:32px}
.mode.on{border-color:var(--oxide);color:var(--oxide);background:rgba(224,102,79,.1)}
.rn{font-family:var(--mono);font-size:11.5px;line-height:1.45;border-radius:8px;padding:8px 10px;margin:0 0 7px;
  border:1px solid var(--oxide);background:rgba(224,102,79,.08);color:var(--ink2)}
.rn b{color:var(--oxide);font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:9.5px;
  display:block;margin-bottom:3px}
.grp.lock{opacity:.42}
.lb2{display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  border:1px solid var(--amber);color:var(--amber);border-radius:6px;padding:3px 7px;margin-bottom:7px}
.note.reha{border-color:var(--oxide);background:rgba(224,102,79,.09)}
.note.reha b{color:var(--oxide)}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
</style>
</head>
<body>
<div class="app">
  <header>
    <button class="back" id="back" style="display:none" aria-label="Zurück">‹</button>
    <h1 id="title">Trainingsplan</h1>
    <span class="sub" id="wk"></span>
    <button class="mode" id="mode" onclick="toggleMode()">Reha</button>
  </header>
  <main id="main"><div class="empty">Lade…</div></main>
</div>
<div class="tbar" id="tbar"><div class="in">
  <span class="num" id="tnum">0</span>
  <span class="lbl" id="tlbl"><b>Pause</b>—</span>
  <button id="tskip">überspringen</button>
</div></div>
<div class="toast" id="toast" role="status"></div>

/* ---------- Historie ---------- */
function hist(id){var h=(LOG[id]||[]).slice();h.sort(function(a,b){return a.d<b.d?-1:1;});return h;}
function histBis(id,bis){return hist(id).filter(function(e){return e.d<bis;});}
function last(id){var h=hist(id);return h.length?h[h.length-1]:null;}

/* Bestwert: höchste Last, bei der in allen vorgeschriebenen Sätzen mindestens
   die Untergrenze erreicht wurde. Ohne Zusatzlast zählt der höchste Wert. */
function bestwert(ex){
  var h=hist(ex.id), best=null;
  h.forEach(function(e){
    if(e.s.length<ex.s) return;
    var w=e.s[0][0], gleich=e.s.every(function(x){return x[0]===w;});
    if(!gleich) return;
    var vmin=Math.min.apply(null,e.s.map(function(x){return x[1];}));
    if(vmin<ex.lo) return;
    var schl = ex.bw&&!w ? vmin : w*1000+vmin;
    if(!best||schl>best.schl) best={schl:schl,w:w,v:vmin,d:e.d};
  });
  return best;
}

/* ---------- Vorschlagsmaschine ---------- */
function e1RM(w,r,rir){return w*(1+(r+rir)/30);}
function abStufe(w,ziel,inc){return w + Math.floor((ziel-w)/inc)*inc;}

function empfehlung(ex,bis){
  var h=histBis(ex.id,bis);
  if(!h.length) return {w:null,k:"",t:"keine Historie — Einstiegslast selbst wählen"};
  var L=h[h.length-1], inc=ex.inc||0;
  var w=L.s[0][0];
  var gleich=L.s.every(function(x){return x[0]===w;});
  var wmax=Math.max.apply(null,L.s.map(function(x){return x[0];}));
  var vmin=Math.min.apply(null,L.s.map(function(x){return x[1];}));
  var rirL=L.s[L.s.length-1][2];
  if(rirL===undefined) rirL=null;
  var dt=tage(L.d,bis);
  var E=isZeit(ex)?" s":" Wdh";
  var UG=ex.neg?-1e9:0;

  /* Regel 1 und 2 rechnen auf der hoechsten Last der letzten Einheit, nicht auf der
     des ersten Satzes. Bei Rampensaetzen (40/45/50) war der erste Satz der leichteste,
     der Wiedereinstieg landete dadurch zwei Stufen zu tief. Regel 3 nutzt wmax bereits. */
  if(dt>14) return {w:Math.max(UG,num(wmax-inc)),k:"down",
    t:"Wiedereinstieg nach "+dt+" Tagen → ein Schritt zurück"+(gleich?"":" (von der höchsten Last "+wmax+" kg)")};
  if(dt>=8) return {w:wmax,k:"",t:"Wiedereinstieg nach "+dt+" Tagen → Last halten"
    +(gleich?"":" (höchste Last "+wmax+" kg)")};
  if(!gleich) return {w:wmax,k:"warn",
    t:"ungleiche Lasten ("+L.s.map(function(x){return x[0];}).join("/")+" kg) → auf eine Last angleichen, kein Anstieg"};

  if(vmin<ex.lo){
    var V=h.length>1?h[h.length-2]:null;
    var unterVor = V && V.s.every(function(x){return x[0]===w;}) &&
                   Math.min.apply(null,V.s.map(function(x){return x[1];}))<ex.lo;
    if(unterVor && inc){
      var neu=w-inc;
      if(!isZeit(ex)){
        var z=e1RM(w,vmin,rirL||0)/(1+(ex.lo+ex.rs)/30);
        neu=Math.min(neu,abStufe(w,z,inc));
      }
      return {w:Math.max(UG,num(neu)),k:"down",
        t:"zweite Einheit unter Bereich ("+vmin+E+" statt "+ex.lo+E+") → Last zurück"};
    }
    return {w:w,k:"warn",t:"unter Bereich ("+vmin+E+" statt "+ex.lo+E+") → Last halten, einmal wiederholen"};
  }

  if(vmin>=ex.hi){
    if(!inc) return {w:w,k:"up",t:"Bereich ausgereizt ("+vmin+E+") → Bereich anpassen, Rücksprache"};
    var basis=num(w+inc), v=basis;
    var t="Bereich ausgereizt ("+vmin+E+" von "+ex.hi+E+") → +"+inc+" kg";
    if(!isZeit(ex) && rirL!==null){
      var ze=e1RM(w,vmin,rirL)/(1+(ex.lo+ex.rs)/30), we=abStufe(w,ze,inc);
      if(we>basis){ v=num(Math.min(we,w+2*inc));
        t=(vmin>ex.hi?"über Bereich ("+vmin+" statt "+ex.hi+" Wdh)":"RIR "+rirL+" bei Obergrenze")
          +" → Doppelschritt auf "+v+" kg";}
    }
    return {w:v,k:"up",t:t};
  }

  var n=0, fort=false;
  for(var i=h.length-1;i>=0;i--){
    if(!h[i].s.every(function(x){return x[0]===w;})) break;
    n++;
  }
  if(h.length>1){
    var P=h[h.length-2];
    fort = P.s.every(function(x){return x[0]===w;}) &&
           vmin>Math.min.apply(null,P.s.map(function(x){return x[1];}));
  }
  if(n>=3 && !fort) return {w:w,k:"warn",
    t:"Stillstand über "+n+" Einheiten → Last halten, Faktenblatt §8 prüfen (Kohlenhydrate ums Training)"};
  return {w:w,k:"",t:"Bereich noch nicht ausgereizt ("+vmin+E+" von "+ex.hi+E+") → Last halten"};
}

    if(im[n]) h+='<figure><img src="data:image/jpeg;base64,'+im[n]+'" alt="'+esc(ex.n)+' '+cap+'" loading="lazy"><figcaption>'+cap+'</figcaption></figure>';});
  h+='</div><div class="head"><div class="n"><b>'+esc(ex.n)+'</b>'
    +'<span class="tgt">'+ex.s+' × '+(ex.lo===ex.hi?ex.lo:ex.lo+'–'+ex.hi)+(Z?' s':'')+'</span></div>'
    +'<div class="rir">'+esc(ex.rir)+'</div>';
  if(MODE==="reha"&&ex.frei&&!frei(ex,today())) h+='<div class="lb2">gesperrt bis '+fmtD(ex.frei)+'</div>';

    +(ex.neg&&E.k==="up"?' — so viel weniger Hilfe':'')+'</div>'
    +'<dl class="cue"><dt>Aufbau</dt><dd>'+esc(ex.setup)+'</dd></dl>'

  h+='</div><div class="sets"><div class="hdr"><span>Satz</span><span>zuletzt</span><span>'

    if(ex.neg) feld='<span class="kgw"><button class="pm" onclick="flip(\''+ex.id+'\','+j+')" '

      +'</span></div>';

function flip(id,j){

    h+='<div class="note reha"><b>'+esc(S.n)+'</b>'+esc(S.t)+'</div>';}

      var lk=(MODE==="reha"&&!frei(ex,today()))?" lock":"";

      if(r)r.value=x[1];
      if(row)row.classList.add("filled");
      if(rr){rr.classList.add("on");
        if(x[2]!==undefined&&x[2]!==null)setRir(ex.id,j,x[2]);}});});
}
async function saveS(){
  var n=0, warn=[];
  items(cur).forEach(function(ex){var sets=[];
    for(var j=0;j<ex.s;j++){
      var wf=$("#w_"+ex.id+"_"+j), rf=$("#r_"+ex.id+"_"+j);
      var w=parseFloat(wf.value), v=parseFloat(rf.value);
      var rir=PEND[ex.id+"_"+j];
      if(!isNaN(v)&&v>0){
        if(isNaN(w)){ if(!ex.bw) warn.push(ex.n); w=0; }
        sets.push([w, v, (rir===undefined?null:rir)]);}}
    if(sets.length){LOG[ex.id]=LOG[ex.id]||[];
      var i=LOG[ex.id].findIndex(function(x){return x.d===today();}),e={d:today(),s:sets};
      if(i>=0)LOG[ex.id][i]=e;else LOG[ex.id].push(e);n++;}});
  if(!n){toast("Nichts eingetragen",1);return;}
  if(warn.length){toast("Ohne Last gespeichert: "+warn[0],1);}
  var ok=await save();
  toast(ok?n+" Übungen gespeichert":"Speichern fehlgeschlagen",!ok);
  if(ok){view="home";render();}
}
async function delEntry(id,d){
  if(!confirm("Eintrag vom "+fmtD(d)+" löschen?"))return;
  LOG[id]=(LOG[id]||[]).filter(function(e){return e.d!==d;});
  if(!LOG[id].length)delete LOG[id];
  var ok=await save();toast(ok?"Eintrag gelöscht":"Speichern fehlgeschlagen",!ok);render();
}
/* Die Importkarte steht im Inhalt und wird auch dann gezeigt, wenn das Protokoll
   leer ist. Genau dann wird sie gebraucht: Vorher endete prog() bei leerem Speicher
   mit "Noch keine Einheiten protokolliert" — der Rueckweg aus einer Sicherung war
   ausgerechnet im Ernstfall nicht erreichbar. */
function impKarte(){
  return '<div class="card"><div class="head"><div class="n"><b>Sicherung einlesen</b></div>'
    + '<div class="rir">Ergänzt das Protokoll · ersetzt nur gleiche Übung am gleichen Datum</div></div>'
    + '<div style="padding:0 16px 14px"><div class="in2">'
    + '<button class="btn ghost" style="flex:1" onclick="imp()">Datei wählen</button>'
    + '<button class="btn ghost" style="flex:1" onclick="impText()">Text einfügen</button></div>'
    + '<textarea id="impbox" placeholder="CSV hier einfügen, dann Übernehmen"></textarea>'
    + '<div id="impgo" class="in2" style="display:none"><button class="btn" style="flex:1" onclick="impGo()">Übernehmen</button></div>'
    + '</div></div>';
}
function prog(){
  var all=REG.o.map(function(id){
    var e=REG.m[id].ex, c={};for(var q in e)c[q]=e[q];c.day=REG.m[id].k;return c;});
  var w=all.filter(function(e){return LOG[e.id]&&LOG[e.id].length;});
  if(!w.length){
    $("#main").innerHTML = impKarte()
      + '<div class="empty">Noch keine Einheiten protokolliert.<br><br>'
      + 'Liegt eine CSV-Sicherung vor, kannst du sie oben einlesen.</div>';
    return;}
  var h="";
  w.forEach(function(ex){
    var hi=hist(ex.id), Z=isZeit(ex);
    var proWert = Z || (ex.bw && hi.every(function(e){return !e.s[0][0];}));
    var pts=hi.map(function(e){return proWert
      ? Math.min.apply(null,e.s.map(function(x){return x[1];}))
      : Math.max.apply(null,e.s.map(function(x){return x[0];}));});
    var eh = proWert ? (Z?' s':' Wdh') : ' kg';
    var d=num(pts[pts.length-1]-pts[0]), B=bestwert(ex);
    h+='<div class="card"><div class="head"><div class="n"><b>'+esc(ex.n)+'</b>'
      +'<span class="tgt">'+pts[pts.length-1]+eh+'</span></div>'
      +'<div class="rir">'+(ex.arch?'abgelöst · ':'')+'Tag '+ex.day+' · '+hi.length+' Einheiten'+(d?' · '+(d>0?"+":"")+d+eh+' seit Start':'')
      +(B?' · Bestwert '+(ex.bw&&!B.w&&!ex.neg?B.v:fmtKg(ex,B.w)+' × '+B.v):'')+'</div>'
      +spark(pts)+'</div><div class="hist">'
      +hi.slice(-6).reverse().map(function(e){
        return '<div class="r"><span>'+fmtD(e.d)+'</span><span class="v">'
          +e.s.map(function(x){return x[0]+"×"+x[1]+(Z?"s":"")
            +(x[2]!==undefined&&x[2]!==null?"·R"+x[2]:"");}).join("  ")
          +'</span><button class="del" onclick="delEntry(\''+ex.id+'\',\''+e.d+'\')" aria-label="löschen">✕</button></div>';}).join("")
      +'</div></div>';});
  h+='<p class="foot">Angezeigt wird das höchste Satzgewicht je Einheit, bei Übungen ohne Zusatzlast '
    +'und im Zeitmodus der schwächste Satz. Der Sägezahn ist normal: nach jeder Laststeigerung '
    +'beginnt der Bereich wieder unten. R = RIR bzw. Güte.<br><br>'
    +'<b style="color:var(--ink2)">CSV laden</b> stellt ein Backup wieder her. Einträge mit gleichem Datum '
    +'und gleicher Übung werden ersetzt, alle übrigen bleiben stehen — der Import ergänzt, er löscht nie. '
    +'Der Verlauf zeigt beide Programme, unabhängig davon, welcher Plan gerade aktiv ist.</p>';
  /* Der Import steht als Karte im Inhalt, nicht in der schwebenden Leiste.
     Er ist eine seltene, bewusste Handlung und darf nicht davon abhaengen,
     ob die Leiste gerade korrekt aufgebaut wurde. */
  $("#main").innerHTML = impKarte() + h;
  {var b=document.createElement("div");b.className="bar";
    b.innerHTML='<div class="in"><button class="btn" onclick="ex_()">Alle Daten als CSV</button></div>';
    document.body.appendChild(b);}
}
function spark(p){
  if(p.length<2)return"";
  var W=280,HH=44,mn=Math.min.apply(null,p),mx=Math.max.apply(null,p),rg=(mx-mn)||1;
  var d=p.map(function(v,i){return (i/(p.length-1)*(W-6)+3).toFixed(1)+","+(HH-5-(v-mn)/rg*(HH-12)).toFixed(1);}).join(" ");
  return '<svg class="spark" viewBox="0 0 '+W+' '+HH+'" preserveAspectRatio="none" role="img" aria-label="Lastverlauf">'
    +'<polyline fill="none" stroke="#3FBFA8" stroke-width="2" points="'+d+'"/></svg>';
}

/* ---------- CSV ---------- */
function csvText(){
  var rows=[["Datum","Einheit","Uebung","ID","Satz","Modus","kg","Wdh","Zeit_s","RIR","Soll_min","Soll_max"]];
  var flat=[];
  Object.keys(LOG).forEach(function(id){
    var ex=exOf(id), k=einheitOf(id);
    hist(id).forEach(function(e){e.s.forEach(function(x,i){
      flat.push({d:e.d,k:k||"?",id:id,ex:ex,i:i+1,x:x});});});});
  flat.sort(function(a,b){
    if(a.d!==b.d)return a.d<b.d?-1:1;
    if(a.k!==b.k)return a.k<b.k?-1:1;
    var oa=ordIdx(a.id), ob=ordIdx(b.id);
    if(oa!==ob)return oa-ob;
    return a.i-b.i;});
  flat.forEach(function(f){
    var Z=f.ex&&isZeit(f.ex), r=f.x[2];
    rows.push([f.d, f.k, f.ex?f.ex.n:f.id, f.id, f.i, Z?"zeit":(f.ex&&f.ex.neg?"hilfe":"kg"),
      String(f.x[0]).replace(".",","), Z?"":f.x[1], Z?f.x[1]:"",
      (r===undefined||r===null)?"":r, f.ex?f.ex.lo:"", f.ex?f.ex.hi:""]);});
  return rows.map(function(r){return r.join(";");}).join("\n");
}
async function ex_(){
  var csv=csvText(), name="training_"+today()+".csv";
  try{
    var file=new File([csv],name,{type:"text/csv"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:name}); return;}
  }catch(e){}
  try{
    var blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"});
    var url=URL.createObjectURL(blob), a=document.createElement("a");
    a.href=url;a.download=name;document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(url);a.remove();},1500);
    toast("CSV geladen: "+name); return;
  }catch(e){}
  if(navigator.clipboard)navigator.clipboard.writeText(csv).then(
    function(){toast("CSV kopiert");},function(){toast("Export nicht möglich",1);});
  else toast("Export nicht möglich",1);
}
/* ---------- CSV-Import ----------
   Liest die vom CSV-Knopf erzeugte Datei zurueck. Bestehende Eintraege desselben
   Datums werden ersetzt, alle uebrigen bleiben stehen — der Import ergaenzt, er loescht nicht. */
async function impMerge(acc){
  var neu=0,ers=0,unb=[];
  Object.keys(acc).forEach(function(id){
    if(!REG.m[id]&&unb.indexOf(id)<0) unb.push(id);
    LOG[id]=LOG[id]||[];
    Object.keys(acc[id]).forEach(function(d){
      var sets=acc[id][d].filter(function(x){return x;});
      if(!sets.length)return;
      var j=LOG[id].findIndex(function(x){return x.d===d;});
      if(j>=0){LOG[id][j]={d:d,s:sets};ers++;}
      else{LOG[id].push({d:d,s:sets});neu++;}
    });
    if(!LOG[id].length) delete LOG[id];
  });
  var ok=await save();
  if(!ok){toast("Speichern fehlgeschlagen",1);return;}
  toast(neu+" neu, "+ers+" ersetzt"+(unb.length?" · "+unb.length+" unbekannte ID":""),!!unb.length);
  render();
}
function csvParse(txt){
  var L=txt.replace(/^\ufeff/,"").split(/\r?\n/).filter(function(x){return x.trim();});
  if(!L.length) return null;
  var head=L[0].split(";").map(function(x){return x.trim();});
  var need=["Datum","ID","Satz","kg","Wdh","Zeit_s","RIR"];
  for(var q=0;q<need.length;q++) if(head.indexOf(need[q])<0) return null;
  var ix={};head.forEach(function(hn,i){ix[hn]=i;});
  var acc={};
  for(var i=1;i<L.length;i++){
    var c=L[i].split(";");
    var d=c[ix.Datum], id=c[ix.ID], s=parseInt(c[ix.Satz],10);
    if(!d||!id||!s) continue;
    var kg=parseFloat(String(c[ix.kg]||"0").replace(",","."));
    if(isNaN(kg)) kg=0;
    var v=parseFloat(String(c[ix.Zeit_s]||"").replace(",","."));
    if(isNaN(v)) v=parseFloat(String(c[ix.Wdh]||"").replace(",","."));
    if(isNaN(v)) continue;
    var r=String(c[ix.RIR]||"").trim(); r=(r==="")?null:parseInt(r,10);
    acc[id]=acc[id]||{};acc[id][d]=acc[id][d]||[];
    acc[id][d][s-1]=[kg,v,r];
  }
  return acc;
}
/* Die Dateiauswahl muss im Dokument haengen und darf nicht zu eng filtern.
   Auf iOS oeffnet .click() an einem losen Element keinen Waehler, und ".csv"
   allein graut die Datei im Dateien-Waehler aus, weil iOS exportierte CSVs
   je nach Herkunft als plain-text oder als Daten typisiert. */
function imp(){
  var inp=document.createElement("input");
  inp.type="file";
  inp.accept=".csv,.txt,text/csv,text/plain,text/comma-separated-values,application/csv,application/vnd.ms-excel";
  inp.style.cssText="position:fixed;left:-9999px;top:0;opacity:0";
  document.body.appendChild(inp);
  var weg=function(){setTimeout(function(){if(inp.parentNode)inp.parentNode.removeChild(inp);},400);};
  inp.onchange=function(){
    var f=inp.files&&inp.files[0];
    if(!f){weg();return;}
    var rd=new FileReader();
    rd.onerror=function(){toast("Datei nicht lesbar",1);weg();};
    rd.onload=async function(){
      weg();
      var acc=csvParse(String(rd.result));
      if(!acc){toast("Keine gültige Trainings-CSV",1);return;}
      await impMerge(acc);
    };
    rd.readAsText(f,"utf-8");
  };
  inp.click();
}
/* Rueckfallweg fuer iOS: Text aus der Zwischenablage. Der Export legt die CSV
   notfalls dort ab, damit ist der Weg zurueck symmetrisch zum Weg hinaus. */
function impText(){
  var t=$("#impbox"), g=$("#impgo");
  if(!t)return;
  var auf=t.style.display!=="block";
  t.style.display=auf?"block":"none";
  if(g)g.style.display=auf?"flex":"none";
  if(auf)t.focus();
}
async function impGo(){
  var t=$("#impbox");
  if(!t||!t.value.trim()){toast("Kein Text eingefügt",1);return;}
  var acc=csvParse(t.value);
  if(!acc){toast("Kein gültiges CSV-Format",1);return;}
  await impMerge(acc);
  t.value="";t.style.display="none";
  var g=$("#impbox")&&$("#impgo"); if(g)g.style.display="none";
}
$("#back").onclick=function(){view="home";render();};
load();
